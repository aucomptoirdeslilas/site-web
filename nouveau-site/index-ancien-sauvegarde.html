<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Au Comptoir Des Lilas</title>
<link rel="icon" type="image/png" href="flavicon.png" />
<meta property="og:title" content="Au Comptoir Des Lilas" />
<meta property="og:description" content="Boucherie, Charcuterie, Traiteur - Produits de qualité" />
<meta property="og:image" content="https://aucomptoirdeslilas.fr/assets/logo.png" />
<meta property="og:url" content="https://aucomptoirdeslilas.fr/" />
<meta property="og:type" content="website" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600&display=swap" />
<style>
:root {
  --paper: #f0e8d6;
  --paper-2: #e7decb;
  --ink: #0d0a07;
  --ink-2: #1a130d;
  --ink-3: #2a1f15;
  --wood: #3a2818;
  --gold: #c89a52;
  --gold-bright: #e1b56b;
  --bleu: #002654;
  --rouge: #b8132a;
  --blanc: #ffffff;
  --line: rgba(13,10,7,.14);
  --line-2: rgba(13,10,7,.08);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 16px;
  line-height: 1.55;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  cursor: none;
}
.display { font-family: 'Anton', sans-serif; letter-spacing: .005em; font-weight: 400; text-transform: uppercase; }
.script { font-family: 'Caveat', cursive; font-weight: 600; }
.serif { font-family: 'Fraunces', serif; font-style: italic; font-weight: 400; }

/* ---------- selection ---------- */
::selection { background: var(--ink); color: var(--gold); }

/* ---------- custom cursor ---------- */
.cursor {
  position: fixed; top: 0; left: 0;
  width: 12px; height: 12px;
  background: var(--gold);
  border-radius: 50%;
  pointer-events: none;
  z-index: 9999;
  mix-blend-mode: difference;
  transform: translate(-50%, -50%);
  transition: width .25s ease, height .25s ease, background .25s ease;
}
.cursor.active {
  width: 64px; height: 64px;
  background: var(--gold);
  mix-blend-mode: normal;
  opacity: .85;
}
.cursor-label {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Anton', sans-serif;
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ink);
  opacity: 0; transition: opacity .25s ease;
  white-space: nowrap;
}
.cursor.active .cursor-label { opacity: 1; }
.cursor.invert { background: var(--paper); mix-blend-mode: normal; }
@media (hover: none) { .cursor { display: none; } body { cursor: auto; } }

/* ---------- loader ---------- */
.loader {
  position: fixed; inset: 0; z-index: 10000;
  background: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 24px;
  transform-origin: top;
  transition: transform 1.2s cubic-bezier(.76,0,.24,1), opacity .4s ease;
}
.loader.gone {
  transform: translateY(-100%);
  pointer-events: none;
}
.loader-logo {
  width: 88px; height: 88px;
  border-radius: 50%; overflow: hidden;
  opacity: 0; transform: scale(.86);
  animation: loaderIn 1s cubic-bezier(.2,.8,.2,1) .2s forwards;
  border: 1px solid rgba(243,236,224,.16);
}
.loader-logo img { width: 100%; height: 100%; object-fit: cover; }
.loader-text {
  font-family: 'Caveat', cursive;
  font-size: 28px; color: var(--gold);
  opacity: 0;
  animation: loaderIn 1s ease .55s forwards;
}
.loader-track {
  width: 220px; height: 1px;
  background: rgba(243,236,224,.18);
  position: relative; overflow: hidden;
  opacity: 0;
  animation: loaderIn .6s ease .9s forwards;
}
.loader-track::after {
  content: ''; position: absolute; inset: 0;
  background: var(--gold);
  transform-origin: left;
  animation: loaderBar 1.4s cubic-bezier(.5,0,.3,1) 1s forwards;
}
@keyframes loaderIn { to { opacity: 1; transform: none; } }
@keyframes loaderBar { from { transform: scaleX(0); } to { transform: scaleX(1); } }

/* ---------- scroll progress ---------- */
.scroll-progress {
  position: fixed; top: 0; left: 0; right: 0;
  height: 2px; z-index: 99;
  background: transparent;
  pointer-events: none;
}
.scroll-progress .bar {
  height: 100%; background: var(--gold);
  transform-origin: left; transform: scaleX(0);
  transition: transform .1s linear;
}

/* ---------- tricolor strip ---------- */
.tricolor {
  display: inline-flex; height: 3px; width: 56px;
  border-radius: 2px; overflow: hidden;
  vertical-align: middle;
}
.tricolor i { flex: 1; height: 100%; }
.tricolor i:nth-child(1) { background: var(--bleu); }
.tricolor i:nth-child(2) { background: var(--blanc); }
.tricolor i:nth-child(3) { background: var(--rouge); }

/* ---------- nav ---------- */
.nav {
  position: fixed; top: 24px; left: 0; right: 0; z-index: 90;
  display: flex; justify-content: center; pointer-events: none;
  transition: top .4s ease;
}
.nav.scrolled { top: 14px; }
.nav-inner {
  pointer-events: auto;
  display: flex; align-items: center; gap: 4px;
  background: rgba(240,232,214,.85);
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border: 1px solid rgba(13,10,7,.08);
  border-radius: 999px;
  padding: 6px 6px 6px 16px;
  box-shadow: 0 18px 40px -16px rgba(13,10,7,.18);
}
.nav-brand {
  display: inline-flex; align-items: center; gap: 10px;
  padding-right: 16px; margin-right: 6px;
  border-right: 1px solid var(--line);
  font-family: 'Anton', sans-serif;
  font-size: 14px; letter-spacing: .08em; text-transform: uppercase;
  white-space: nowrap;
}
.nav-brand img { width: 30px; height: 30px; object-fit: contain; }
.nav-brand .sep { color: var(--rouge); font-style: italic; }
.nav a.nav-link {
  color: var(--ink); text-decoration: none;
  font-family: 'Anton', sans-serif;
  font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  padding: 10px 14px; border-radius: 999px;
  transition: background .25s, color .25s;
  white-space: nowrap;
}
.nav a.nav-link:hover { background: rgba(13,10,7,.08); }
.nav a.nav-link.active { background: var(--ink); color: var(--paper); }
.nav-cta {
  background: var(--ink); color: var(--paper);
  border: none; font-family: 'Anton', sans-serif;
  font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
  padding: 11px 18px; border-radius: 999px;
  cursor: none; display: inline-flex; align-items: center; gap: 9px;
  transition: background .25s, transform .25s;
}
.nav-cta:hover { background: var(--wood); transform: translateY(-1px); }
.nav-cta .dot { width: 6px; height: 6px; background: var(--gold); border-radius: 50%; }

/* ---------- hero ---------- */
.hero {
  position: relative;
  height: 100vh; min-height: 720px;
  overflow: hidden;
  background: var(--ink);
  color: var(--paper);
}
.hero-video {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  z-index: 0;
  filter: brightness(.55) contrast(1.08) saturate(.92);
  will-change: transform;
}
.hero-grad {
  position: absolute; inset: 0; z-index: 1;
  background:
    radial-gradient(ellipse 60% 60% at 50% 20%, transparent 0%, rgba(0,0,0,.4) 70%),
    linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,.05) 30%, rgba(0,0,0,.2) 60%, rgba(13,10,7,.92) 100%);
}
.hero-noise {
  position: absolute; inset: 0; z-index: 2;
  background-image: radial-gradient(rgba(243,236,224,.05) 1px, transparent 1.2px);
  background-size: 3px 3px;
  mix-blend-mode: overlay;
  pointer-events: none;
}
.hero-inner {
  position: relative; z-index: 3;
  height: 100%; max-width: 1600px; margin: 0 auto;
  padding: 144px 56px 48px;
  display: flex; flex-direction: column; justify-content: space-between;
}

.hero-top {
  display: flex; justify-content: space-between; align-items: flex-start;
  font-family: 'Anton', sans-serif;
  font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
  color: rgba(243,236,224,.65);
}
.hero-top em { font-style: normal; color: var(--gold); }
.hero-top .col { display: flex; flex-direction: column; gap: 6px; }
.hero-top .col.r { text-align: right; }

.hero-main {
  display: flex; flex-direction: column; gap: 28px;
}
.hero-eyebrow {
  display: inline-flex; align-items: baseline; gap: 16px;
  font-family: 'Caveat', cursive;
  font-size: 34px; color: var(--gold);
  line-height: 1;
}
.hero-eyebrow .tricolor { align-self: center; }

.hero h1 {
  font-family: 'Anton', sans-serif; font-weight: 400;
  font-size: clamp(72px, 14vw, 240px);
  line-height: .82;
  letter-spacing: -.008em;
  color: var(--paper);
  margin: 0; text-transform: uppercase;
}
.hero h1 .line { display: block; overflow: hidden; }
.hero h1 .word {
  display: inline-block;
  overflow: hidden;
  vertical-align: bottom;
}
.hero h1 .word .inner {
  display: inline-block;
  transform: translateY(110%);
  animation: lineUp .9s cubic-bezier(.2,.8,.2,1) forwards;
}
@keyframes lineUp { to { transform: translateY(0); } }
.hero h1 .stroke {
  -webkit-text-stroke: 1.5px var(--paper);
  color: transparent;
}
.hero h1 .gold { color: var(--gold); }
.hero h1 .serif {
  font-family: 'Fraunces', serif; font-style: italic;
  font-weight: 400; text-transform: lowercase;
  font-size: .8em;
  color: var(--paper);
  letter-spacing: -.01em;
}

.hero-bot {
  display: flex; justify-content: space-between; align-items: flex-end;
  gap: 32px;
}
.hero-bot-left { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 16px 24px; border-radius: 999px;
  font-family: 'Anton', sans-serif;
  font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
  text-decoration: none; cursor: none; border: none;
  transition: transform .3s cubic-bezier(.2,.8,.2,1), background .25s, color .25s;
}
.btn-gold { background: var(--gold); color: var(--ink); }
.btn-gold:hover { background: var(--gold-bright); transform: translateY(-2px); }
.btn-ink { background: var(--ink); color: var(--paper); }
.btn-ink:hover { background: var(--ink-3); transform: translateY(-2px); }
.btn-ghost-light {
  background: transparent; color: var(--paper);
  border: 1px solid rgba(243,236,224,.35);
}
.btn-ghost-light:hover { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.btn .arrow {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--ink); color: var(--gold);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 13px;
}
.btn-ghost-light .arrow { background: var(--paper); color: var(--ink); }

.hero-services {
  display: inline-flex; align-items: center; gap: 14px;
  background: rgba(243,236,224,.08);
  border: 1px solid rgba(243,236,224,.16);
  backdrop-filter: blur(8px);
  padding: 8px 12px 8px 14px;
  border-radius: 999px;
  font-family: 'Anton', sans-serif;
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: rgba(243,236,224,.85);
}
.hero-services i.dot {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--gold); display: inline-block;
}
.hero-services .sep { color: rgba(243,236,224,.3); }

.hero-scroll {
  display: inline-flex; align-items: center; gap: 14px;
  font-family: 'Anton', sans-serif;
  font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
  color: rgba(243,236,224,.7);
}
.hero-scroll .arr {
  width: 38px; height: 38px;
  border: 1px solid rgba(243,236,224,.35);
  border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  animation: bob 2.4s ease-in-out infinite;
}
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }

/* ---------- giant scroll marquee ---------- */
.bigmarquee {
  background: var(--ink);
  color: var(--paper);
  padding: 48px 0;
  overflow: hidden;
  border-top: 1px solid rgba(243,236,224,.06);
  border-bottom: 1px solid rgba(243,236,224,.06);
}
.bigmarquee-track {
  display: inline-flex; gap: 72px;
  padding-left: 72px;
  font-family: 'Anton', sans-serif;
  font-size: clamp(64px, 11vw, 168px);
  line-height: 1;
  text-transform: uppercase;
  white-space: nowrap;
  letter-spacing: -.005em;
  animation: marquee 38s linear infinite;
}
@keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
.bigmarquee-track .it { color: transparent; -webkit-text-stroke: 1.5px var(--paper); }
.bigmarquee-track .sep {
  display: inline-flex; align-items: center;
  color: var(--gold);
  font-family: 'Caveat', cursive;
  font-size: .55em; text-transform: lowercase;
  letter-spacing: 0;
  transform: translateY(-.08em);
  font-weight: 700;
}
.bigmarquee-track .x {
  color: var(--gold);
  font-family: 'Fraunces', serif; font-style: italic;
  font-size: .9em;
}

/* ---------- section base ---------- */
section { position: relative; }
.section {
  max-width: 1480px; margin: 0 auto;
  padding: 160px 56px; position: relative;
}
.eyebrow {
  display: inline-flex; align-items: center; gap: 16px;
  font-family: 'Anton', sans-serif;
  font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
  color: var(--ink); margin-bottom: 28px;
}
.eyebrow .tricolor { transform: translateY(-1px); }
.eyebrow .num { color: var(--gold); }

h2.bigtitle {
  font-family: 'Anton', sans-serif;
  font-weight: 400;
  font-size: clamp(56px, 8vw, 132px);
  line-height: .9;
  letter-spacing: -.005em;
  margin: 0; text-transform: uppercase;
  color: var(--ink);
}
h2.bigtitle .stroke {
  -webkit-text-stroke: 1.5px var(--ink);
  color: transparent;
}
h2.bigtitle .script {
  font-family: 'Caveat', cursive; color: var(--rouge);
  font-size: .58em; text-transform: none;
  letter-spacing: 0; font-weight: 700;
  display: inline-block; transform: translateY(-.08em);
  margin: 0 .04em;
}
h2.bigtitle .serif {
  font-family: 'Fraunces', serif;
  font-style: italic; font-weight: 400;
  text-transform: lowercase;
  font-size: .82em;
  letter-spacing: -.01em;
  margin: 0 .02em;
}

/* ---------- clean placeholder (replaces stripes) ---------- */
.imgbox {
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, var(--ink-3), var(--ink-2) 60%, var(--ink));
  border-radius: 4px;
}
.imgbox::before {
  content: '';
  position: absolute; inset: 0;
  background-image: radial-gradient(rgba(243,236,224,.04) 1px, transparent 1.2px);
  background-size: 3px 3px;
  pointer-events: none;
}
.imgbox::after {
  content: attr(data-label);
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Caveat', cursive;
  font-size: clamp(34px, 5vw, 80px);
  color: var(--gold);
  text-align: center;
  padding: 24px;
  letter-spacing: 0;
  line-height: 1.05;
  transform: rotate(-3deg);
  opacity: .85;
}
.imgbox .tagline {
  position: absolute; bottom: 18px; left: 22px;
  font-family: 'Anton', sans-serif;
  font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
  color: rgba(243,236,224,.55);
  z-index: 2;
}
.imgbox .pill {
  position: absolute; top: 18px; left: 22px;
  background: rgba(243,236,224,.1);
  backdrop-filter: blur(8px);
  border: 1px solid rgba(243,236,224,.18);
  font-family: 'Anton', sans-serif;
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--paper);
  padding: 6px 11px; border-radius: 999px;
  z-index: 2;
}
.imgbox.paper {
  background: linear-gradient(135deg, var(--paper-2), var(--paper));
}
.imgbox.paper::before {
  background-image: radial-gradient(rgba(13,10,7,.06) 1px, transparent 1.2px);
}
.imgbox.paper::after { color: var(--wood); opacity: .7; }
.imgbox.paper .tagline { color: rgba(13,10,7,.5); }
.imgbox.paper .pill { color: var(--ink); background: rgba(13,10,7,.06); border-color: rgba(13,10,7,.1); }
.imgbox.wood {
  background:
    radial-gradient(ellipse at 30% 40%, rgba(168,122,74,.3), transparent 60%),
    linear-gradient(180deg, #5a3a1f, #2a1a0e);
}

/* ---------- maison / sticky reveal ---------- */
.maison {
  background: var(--paper);
  position: relative;
}
.maison-grid {
  display: grid; grid-template-columns: 1.05fr 1fr;
  gap: 96px; align-items: start;
}
.maison-img-col {
  position: relative;
}
.maison-img-sticky {
  position: sticky; top: 110px;
}
.maison-imgwrap {
  position: relative;
  aspect-ratio: 4/5;
  border-radius: 6px; overflow: hidden;
  box-shadow: 0 40px 100px -30px rgba(13,10,7,.4);
  clip-path: inset(var(--clip, 8%));
  transition: clip-path 1.4s cubic-bezier(.2,.8,.2,1);
}
.maison-imgwrap.in { --clip: 0%; }
.maison-imgwrap img {
  width: 100%; height: 100%; object-fit: cover;
  filter: contrast(1.06) saturate(.96);
  transform: scale(1.06);
  transition: transform 8s ease-out;
}
.maison-imgwrap.in img { transform: scale(1); }
.maison-imgwrap .badge {
  position: absolute; left: 22px; right: 22px; bottom: 22px;
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(13,10,7,.78);
  backdrop-filter: blur(10px);
  color: var(--paper);
  padding: 14px 18px;
  border-radius: 4px;
  font-family: 'Anton', sans-serif;
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
}
.maison-imgwrap .badge .script {
  font-family: 'Caveat', cursive; color: var(--gold);
  font-size: 1.6em; text-transform: none;
  letter-spacing: 0;
}

.maison-text { padding-top: 24px; }
.maison-text .lead {
  font-family: 'Fraunces', serif; font-style: italic; font-weight: 400;
  font-size: clamp(24px, 2.6vw, 36px); line-height: 1.3;
  color: var(--ink-2);
  max-width: 540px;
  margin: 32px 0 32px;
}
.maison-text .lead .underline {
  position: relative; display: inline-block;
  white-space: nowrap;
}
.maison-text .lead .underline::after {
  content: '';
  position: absolute; left: 0; right: 0; bottom: -2px;
  height: 8px; background: var(--gold);
  opacity: .35; z-index: -1;
}
.maison-text .copy {
  font-size: 16px; line-height: 1.7;
  color: var(--ink-2); max-width: 480px;
  margin: 0 0 18px;
}
.maison-services {
  margin-top: 56px;
  display: flex; flex-direction: column;
  border-top: 1px solid var(--line);
}
.maison-service {
  display: grid; grid-template-columns: 56px 1fr auto;
  gap: 28px; align-items: center;
  padding: 22px 0;
  border-bottom: 1px solid var(--line);
  transition: padding-left .4s cubic-bezier(.2,.8,.2,1), background .3s ease;
  cursor: none;
}
.maison-service:hover { padding-left: 18px; }
.maison-service .num {
  font-family: 'Anton', sans-serif;
  color: var(--rouge);
  font-size: 28px;
}
.maison-service .name {
  font-family: 'Anton', sans-serif;
  font-size: clamp(28px, 3vw, 44px);
  letter-spacing: -.005em;
  text-transform: uppercase;
}
.maison-service .name .it {
  font-family: 'Caveat', cursive;
  color: var(--gold);
  font-size: .7em; margin-left: 8px;
  text-transform: lowercase;
}
.maison-service .arr {
  font-family: 'Anton', sans-serif; font-size: 24px;
  color: var(--ink);
  transition: transform .3s;
}
.maison-service:hover .arr { transform: translateX(8px); }

/* ---------- maison intro (texte plein, sous le header) ---------- */
.maison-intro { max-width: 920px; }
.maison-intro .lead {
  font-family: 'Fraunces', serif; font-style: italic; font-weight: 400;
  font-size: clamp(24px, 2.8vw, 38px); line-height: 1.3;
  color: var(--ink-2);
  max-width: 820px;
  margin: 32px 0 0;
}
.maison-intro .lead .underline { position: relative; display: inline-block; }
.maison-intro .lead .underline::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -2px;
  height: 8px; background: var(--gold); opacity: .35; z-index: -1;
}

/* ---------- notre histoire ---------- */
.histoire { background: var(--paper-2); }
.histoire-grid {
  display: grid; grid-template-columns: .9fr 1.1fr;
  gap: 80px; align-items: start;
}
.histoire-text .lead {
  font-family: 'Fraunces', serif; font-style: italic; font-weight: 400;
  font-size: clamp(22px, 2.2vw, 30px); line-height: 1.35;
  color: var(--ink-2); margin: 0 0 28px; max-width: 560px;
}
.histoire-text .copy {
  font-size: 16px; line-height: 1.75; color: var(--ink-2);
  max-width: 560px; margin: 0 0 18px;
}
.histoire-text .copy strong { color: var(--rouge); font-weight: 500; }

/* ---------- notre vision (fondateur) ---------- */
.vision { background: var(--paper); }
.vision-grid {
  display: grid; grid-template-columns: .85fr 1.15fr;
  gap: 72px; align-items: start;
}
.vision-img-col { position: sticky; top: 110px; }
.vision-imgwrap {
  position: relative;
  aspect-ratio: 4/5;
  max-width: 360px;
  border-radius: 6px; overflow: hidden;
  box-shadow: 0 30px 70px -28px rgba(13,10,7,.4);
}
.vision-imgwrap img {
  width: 100%; height: 100%; object-fit: cover;
  filter: contrast(1.06) saturate(.96);
}
.vision-imgwrap .badge {
  position: absolute; left: 16px; right: 16px; bottom: 16px;
  display: flex; justify-content: space-between; align-items: center;
  background: rgba(13,10,7,.78);
  backdrop-filter: blur(10px);
  color: var(--paper);
  padding: 11px 14px; border-radius: 4px;
  font-family: 'Anton', sans-serif;
  font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
}
.vision-imgwrap .badge .script {
  font-family: 'Caveat', cursive; color: var(--gold);
  font-size: 1.5em; text-transform: none; letter-spacing: 0;
}
.vision-bio {
  margin: 22px 0 0; max-width: 360px;
  font-size: 13.5px; line-height: 1.65; color: var(--ink-2);
}
.vision-text .copy {
  font-size: 16px; line-height: 1.75; color: var(--ink-2);
  max-width: 560px; margin: 0 0 18px;
}
.vision-text .copy strong { color: var(--rouge); font-weight: 500; }
.vision-text .lead {
  font-family: 'Fraunces', serif; font-style: italic; font-weight: 400;
  font-size: clamp(22px, 2.2vw, 30px); line-height: 1.35;
  color: var(--ink-2); margin: 28px 0 0; max-width: 560px;
}
.vision-text .lead .underline { position: relative; display: inline-block; }
.vision-text .lead .underline::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: -2px;
  height: 8px; background: var(--gold); opacity: .35; z-index: -1;
}

/* ---------- stats ---------- */
.stats {
  background: var(--ink);
  color: var(--paper);
  position: relative;
  overflow: hidden;
}
.stats-inner {
  max-width: 1480px; margin: 0 auto;
  padding: 100px 56px;
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 24px;
}
.stat {
  border-left: 1px solid rgba(243,236,224,.12);
  padding-left: 24px;
}
.stat:first-child { border-left: none; padding-left: 0; }
.stat .n {
  font-family: 'Anton', sans-serif;
  font-size: clamp(72px, 7vw, 112px);
  line-height: 1; letter-spacing: -.01em;
  color: var(--paper);
  display: block;
}
.stat .n .gold { color: var(--gold); }
.stat .n .stroke { -webkit-text-stroke: 1.5px var(--paper); color: transparent; }
.stat .lbl {
  margin-top: 14px;
  font-family: 'Anton', sans-serif;
  font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
  color: rgba(243,236,224,.6);
  max-width: 200px;
  line-height: 1.5;
}

/* ---------- métiers ---------- */
.metiers {
  background: var(--paper-2);
  color: var(--ink);
}
.metiers-head {
  display: grid; grid-template-columns: 1.2fr 1fr;
  align-items: end; gap: 64px;
  margin-bottom: 96px;
}
.metiers-head p {
  color: var(--ink-2);
  max-width: 460px; margin: 0;
  font-size: 16px; line-height: 1.7;
}
.metiers-stack {
  display: flex; flex-direction: column;
  border-top: 1px solid var(--line);
}
.metier-row {
  display: grid;
  grid-template-columns: 70px 1fr 300px 64px;
  gap: 40px; align-items: center;
  padding: 28px 0;
  border-bottom: 1px solid var(--line);
  position: relative;
  cursor: none;
  transition: background .4s ease;
}
.metier-row::before {
  content: ''; position: absolute;
  inset: 0; pointer-events: none;
  background: var(--ink); opacity: 0;
  transition: opacity .35s ease;
}
.metier-row .col { position: relative; z-index: 1; }
.metier-row:hover { color: var(--paper); }
.metier-row:hover::before { opacity: 1; }
.metier-row:hover .num { color: var(--gold); }
.metier-row:hover .arr { background: var(--gold); color: var(--ink); }
.metier-row:hover .desc { color: rgba(243,236,224,.75); }

.metier-row .num {
  font-family: 'Anton', sans-serif;
  font-size: 48px; color: var(--ink);
  transition: color .3s;
}
.metier-row .title {
  font-family: 'Anton', sans-serif;
  font-size: clamp(48px, 5.2vw, 80px);
  line-height: .95;
  text-transform: uppercase;
  letter-spacing: -.005em;
}
.metier-row .title .script {
  font-family: 'Caveat', cursive;
  color: var(--gold);
  font-size: .58em; text-transform: lowercase;
  font-weight: 700;
  margin-right: 12px;
}
.metier-row .desc {
  font-family: 'Inter', sans-serif;
  font-weight: 300;
  font-size: 14px; line-height: 1.65;
  color: var(--ink-2);
  max-width: 460px;
  margin-top: 14px;
  text-transform: none;
  letter-spacing: 0;
  transition: color .3s;
}
.metier-row .arr {
  width: 56px; height: 56px;
  border-radius: 50%;
  background: var(--paper);
  border: 1px solid var(--line);
  align-self: center;
  margin-left: auto;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: 'Anton', sans-serif;
  font-size: 22px;
  transition: background .3s, color .3s, transform .35s;
}
.metier-row:hover .arr { transform: rotate(-12deg); }
.metier-row .preview {
  position: relative;
  width: 100%; height: 170px;
  border-radius: 6px; overflow: hidden;
  z-index: 1;
  box-shadow: 0 20px 44px -16px rgba(13,10,7,.45);
  background: var(--ink-3);
  transition: transform .5s cubic-bezier(.2,.8,.2,1), box-shadow .4s ease;
}
.metier-row:hover .preview {
  transform: scale(1.03);
  box-shadow: 0 28px 60px -14px rgba(0,0,0,.6);
}
.metier-row .preview video {
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  filter: contrast(1.06) saturate(.96);
}

/* ---------- selection ---------- */
.selection { background: var(--paper); position: relative; overflow: hidden; }
.sel-watermark {
  position: absolute; top: 6%; right: -4%;
  font-family: 'Anton', sans-serif;
  font-size: 26vw; line-height: .8;
  color: rgba(13,10,7,.04);
  letter-spacing: -.005em;
  pointer-events: none; z-index: 0;
  white-space: nowrap; will-change: transform;
  text-transform: uppercase;
}
.sel-head {
  display: grid; grid-template-columns: 1.2fr 1fr;
  align-items: end; gap: 64px; margin-bottom: 64px;
  position: relative; z-index: 2;
}
.sel-head p {
  color: var(--ink-2); max-width: 420px; margin: 0;
  font-size: 15px; line-height: 1.7;
}
.sel-tabs {
  display: flex; gap: 6px; margin-bottom: 56px; flex-wrap: wrap;
  position: relative; z-index: 2;
}
.sel-tab {
  font-family: 'Anton', sans-serif;
  font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
  padding: 12px 20px;
  background: transparent; color: var(--ink-2);
  border: 1px solid var(--line); border-radius: 999px;
  cursor: none; transition: all .25s ease;
  display: inline-flex; align-items: center; gap: 10px;
}
.sel-tab:hover { color: var(--ink); border-color: var(--ink); }
.sel-tab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.sel-tab .ct {
  background: rgba(13,10,7,.08); border-radius: 999px;
  padding: 2px 8px; font-size: 10px;
  color: var(--rouge);
}
.sel-tab.active .ct { background: rgba(243,236,224,.12); color: var(--gold); }

.products {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px;
  position: relative; z-index: 2;
}
.product {
  display: flex; flex-direction: column; gap: 16px;
  cursor: none;
  transition: transform .4s cubic-bezier(.2,.8,.2,1);
}
.product:hover { transform: translateY(-6px); }
.product .imgwrap {
  position: relative; aspect-ratio: 4/5;
  border-radius: 4px; overflow: hidden;
}
.product .imgwrap .imgbox {
  width: 100%; height: 100%;
  border-radius: 0;
  transition: transform .8s ease;
}
.product:hover .imgwrap .imgbox { transform: scale(1.05); }
.product-foot { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.product-foot h4 {
  font-family: 'Anton', sans-serif;
  font-weight: 400; font-size: 22px;
  margin: 0; line-height: 1.1;
  text-transform: uppercase;
}
.product-foot .price {
  font-family: 'Caveat', cursive;
  font-size: 20px; color: var(--rouge);
}
.product-meta {
  font-family: 'Anton', sans-serif;
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: rgba(13,10,7,.55);
}

/* ---------- pub video section ---------- */
.pub {
  position: relative;
  min-height: 100vh;
  overflow: hidden;
  background: var(--ink);
  color: var(--paper);
}
.pub-video {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  filter: brightness(.5) contrast(1.08) saturate(.92);
  will-change: transform;
}
.pub-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(13,10,7,.4) 0%, rgba(13,10,7,.1) 30%, rgba(13,10,7,.85) 100%);
}
.pub-inner {
  position: relative; z-index: 2;
  min-height: 100vh;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: 100px 56px 80px;
  max-width: 1480px; margin: 0 auto;
}
.pub-tag {
  font-family: 'Caveat', cursive;
  font-size: 36px; color: var(--gold);
  margin-bottom: 16px;
}
.pub h2 {
  font-family: 'Anton', sans-serif; font-weight: 400;
  font-size: clamp(64px, 9vw, 168px); line-height: .82;
  margin: 0 0 40px; text-transform: uppercase;
  letter-spacing: -.005em;
}
.pub h2 .stroke { -webkit-text-stroke: 1.5px var(--paper); color: transparent; }
.pub-foot {
  display: flex; justify-content: space-between; align-items: end;
  gap: 32px; flex-wrap: wrap;
}
.pub-foot p {
  color: rgba(243,236,224,.78);
  max-width: 480px; margin: 0;
  font-size: 16px; line-height: 1.7;
}

/* ---------- galerie ---------- */
.galerie { background: var(--paper); }
.gal-head { display: flex; justify-content: space-between; align-items: end; margin-bottom: 64px; gap: 32px; flex-wrap: wrap; }
.gal-head p { color: var(--ink-2); max-width: 380px; margin: 0; }
.gal-grid {
  display: grid; grid-template-columns: repeat(12, 1fr);
  grid-auto-rows: 140px; gap: 14px;
}
.gal-item { overflow: hidden; border-radius: 4px; will-change: transform; cursor: none; }
.gal-item .imgbox { width: 100%; height: 100%; transition: transform 1s ease; border-radius: 0; }
.gal-item:hover .imgbox { transform: scale(1.06); }
.gi1 { grid-column: span 5; grid-row: span 3; }
.gi2 { grid-column: span 4; grid-row: span 2; }
.gi3 { grid-column: span 3; grid-row: span 2; }
.gi4 { grid-column: span 4; grid-row: span 3; }
.gi5 { grid-column: span 3; grid-row: span 3; }
.gi6 { grid-column: span 5; grid-row: span 2; }

/* ---------- contact ---------- */
.contact { background: var(--ink); color: var(--paper); }
.contact .section { padding: 160px 56px; }
.contact h2.bigtitle { color: var(--paper); }
.contact h2.bigtitle .stroke { -webkit-text-stroke: 1.5px var(--paper); }
.contact h2.bigtitle .script { color: var(--gold); }
.contact .eyebrow { color: var(--paper); }
.contact .eyebrow .num { color: var(--gold); }

.contact-grid {
  display: grid; grid-template-columns: 1.1fr 1fr;
  gap: 80px;
}
.contact-lead {
  font-family: 'Fraunces', serif; font-style: italic;
  font-size: 22px; line-height: 1.45;
  color: rgba(243,236,224,.8);
  max-width: 460px; margin: 28px 0 0;
}
.contact-info {
  display: grid; grid-template-columns: repeat(2, 1fr);
  gap: 56px;
  margin-top: 80px;
}
.contact-block .lbl {
  font-family: 'Anton', sans-serif;
  font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
  color: var(--gold); margin-bottom: 14px;
}
.contact-block .val {
  font-family: 'Anton', sans-serif;
  font-size: 22px; line-height: 1.3;
  color: var(--paper); text-transform: uppercase;
}
.contact-block .val em {
  font-family: 'Caveat', cursive; color: var(--gold);
  font-style: normal; font-size: 1.1em; text-transform: none;
}
.contact-block .val.body {
  font-family: 'Inter', sans-serif; font-weight: 400;
  font-size: 15px; text-transform: none; line-height: 1.7;
}

.contact-card {
  background: rgba(243,236,224,.04);
  border: 1px solid rgba(243,236,224,.12);
  border-radius: 8px; padding: 40px;
}
.contact-card h3 {
  font-family: 'Anton', sans-serif; font-weight: 400;
  font-size: 32px; margin: 0 0 6px;
  text-transform: uppercase;
}
.contact-card h3 .script {
  font-family: 'Caveat', cursive; color: var(--gold);
  text-transform: none; font-size: 1.1em;
}
.contact-card .sub {
  font-family: 'Anton', sans-serif;
  font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
  color: rgba(243,236,224,.55); margin-bottom: 28px;
}
.field { margin-bottom: 16px; }
.field label {
  display: block;
  font-family: 'Anton', sans-serif;
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: rgba(243,236,224,.55); margin-bottom: 6px;
}
.field input, .field textarea, .field select {
  width: 100%; background: transparent; border: none;
  border-bottom: 1px solid rgba(243,236,224,.2);
  color: var(--paper); font-family: inherit;
  font-size: 15px; padding: 8px 0 10px; outline: none;
  transition: border-color .25s;
}
.field input:focus, .field textarea:focus, .field select:focus { border-bottom-color: var(--gold); }
.field textarea { resize: vertical; min-height: 64px; }
.field select option { background: var(--ink); }
.field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.contact-card button {
  margin-top: 16px; width: 100%;
  background: var(--gold); color: var(--ink);
  border: none; padding: 18px 22px; border-radius: 999px;
  font-family: 'Anton', sans-serif;
  font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
  cursor: none; transition: background .25s, transform .3s;
  display: inline-flex; align-items: center; justify-content: center; gap: 12px;
}
.contact-card button:hover { background: var(--gold-bright); transform: translateY(-2px); }
.contact-card button .arrow {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--ink); color: var(--gold);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 13px;
}
.contact-card .ok {
  background: rgba(200,154,82,.12); border: 1px solid var(--gold);
  color: var(--gold); padding: 14px 18px; border-radius: 4px;
  font-size: 13px; margin-top: 18px;
  font-family: 'Anton', sans-serif; letter-spacing: .08em; text-transform: uppercase;
}

/* ---------- footer ---------- */
.footer {
  background: var(--ink-2); color: rgba(243,236,224,.7);
  padding: 88px 56px 32px;
  border-top: 1px solid rgba(243,236,224,.06);
  position: relative; overflow: hidden;
}
.footer-inner {
  max-width: 1480px; margin: 0 auto;
  display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr;
  gap: 56px; margin-bottom: 64px;
}
.footer-brand {
  display: flex; align-items: center; gap: 16px;
  margin-bottom: 18px;
}
.footer-brand img { width: 68px; height: 68px; object-fit: contain; }
.footer-brand .t {
  font-family: 'Anton', sans-serif;
  font-size: 22px; line-height: 1;
  color: var(--paper); text-transform: uppercase;
  letter-spacing: .04em;
}
.footer-brand .t span { color: var(--rouge); }
.footer-col h5 {
  font-family: 'Anton', sans-serif;
  font-size: 12px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--gold); margin: 0 0 22px; font-weight: 500;
}
.footer-col a {
  color: rgba(243,236,224,.7); text-decoration: none;
  display: block; margin-bottom: 10px;
  font-size: 14px; transition: color .25s;
  cursor: none;
}
.footer-col a:hover { color: var(--gold); }
.footer-mega {
  font-family: 'Anton', sans-serif;
  font-size: clamp(72px, 18vw, 320px);
  line-height: .82;
  color: transparent;
  -webkit-text-stroke: 1px rgba(243,236,224,.12);
  text-align: center;
  margin: 0 -56px 32px;
  text-transform: uppercase;
  letter-spacing: -.005em;
  pointer-events: none;
  white-space: nowrap;
}
.footer-mega .script {
  font-family: 'Caveat', cursive; color: var(--gold);
  -webkit-text-stroke: 0;
  font-size: .5em; text-transform: none;
  display: inline-block; transform: translateY(-.1em);
  margin: 0 .1em;
}
.footer-bot {
  max-width: 1480px; margin: 0 auto;
  display: flex; justify-content: space-between; align-items: center;
  padding-top: 24px;
  border-top: 1px solid rgba(243,236,224,.06);
  font-family: 'Anton', sans-serif;
  font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
  color: rgba(243,236,224,.45);
  gap: 16px; flex-wrap: wrap;
}

/* ---------- map / venez nous voir ---------- */
.visite { background: var(--paper); }
.visite-head {
  display: flex; justify-content: space-between; align-items: end;
  margin-bottom: 56px; gap: 32px; flex-wrap: wrap;
}
.visite-head p { color: var(--ink-2); max-width: 420px; margin: 0; font-size: 16px; line-height: 1.7; }
.visite-mapwrap {
  position: relative;
  border-radius: 8px; overflow: hidden;
  box-shadow: 0 40px 100px -30px rgba(13,10,7,.4);
  border: 1px solid var(--line);
  aspect-ratio: 21 / 9;
  background: var(--ink-3);
}
.visite-mapwrap iframe { width: 100%; height: 100%; display: block; filter: grayscale(.25) contrast(1.05); }
.visite-pin {
  position: absolute; left: 22px; bottom: 22px; z-index: 2;
  display: inline-flex; align-items: center; gap: 14px;
  background: rgba(13,10,7,.82);
  backdrop-filter: blur(10px);
  color: var(--paper);
  padding: 14px 20px; border-radius: 999px;
  font-family: 'Anton', sans-serif;
  font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
  text-decoration: none; cursor: none;
  transition: background .25s, transform .3s;
}
.visite-pin:hover { background: var(--ink); transform: translateY(-2px); }
.visite-pin .nav-arrow { color: var(--gold); font-size: 16px; }
@media (max-width: 1100px) {
  .visite-pin { cursor: pointer; }
  .visite-mapwrap { aspect-ratio: 4 / 3; }
}
@media (max-width: 640px) {
  .visite-mapwrap { aspect-ratio: 1 / 1; }
}

/* ---------- reveal ---------- */
.reveal { opacity: 0; transform: translateY(36px); transition: opacity 1.1s ease, transform 1.2s cubic-bezier(.2,.7,.2,1); }
.reveal.in { opacity: 1; transform: none; }
.reveal-d1 { transition-delay: .08s; }
.reveal-d2 { transition-delay: .16s; }
.reveal-d3 { transition-delay: .24s; }
.reveal-d4 { transition-delay: .32s; }

/* ---------- responsive ---------- */
@media (max-width: 1100px) {
  body { cursor: auto; }
  .cursor { display: none; }
  .btn, .nav-cta, .sel-tab, .product, .maison-service, .metier-row, .gal-item, .footer-col a, .contact-card button { cursor: pointer; }
  .nav-inner { padding: 6px 6px 6px 14px; }
  .nav-brand { font-size: 12px; padding-right: 10px; margin-right: 4px; }
  .nav-brand img { width: 24px; height: 24px; }
  .nav a.nav-link { padding: 9px 10px; font-size: 10px; letter-spacing: .08em; }
  .nav-cta { padding: 9px 14px; font-size: 11px; }
  .hero-inner { padding: 124px 28px 28px; }
  .section { padding: 100px 28px; }
  .stats-inner { padding: 64px 28px; grid-template-columns: 1fr 1fr; gap: 40px 24px; }
  .stat { border-left: none; padding-left: 0; }
  .maison-grid { grid-template-columns: 1fr; gap: 56px; }
  .maison-img-sticky { position: static; }
  .histoire-grid { grid-template-columns: 1fr; gap: 32px; }
  .vision-grid { grid-template-columns: 1fr; gap: 40px; }
  .vision-img-col { position: static; }
  .vision-imgwrap { max-width: 320px; margin: 0 auto; }
  .vision-bio { max-width: none; }
  .metiers-head { grid-template-columns: 1fr; gap: 28px; }
  .metier-row { grid-template-columns: 56px 1fr; grid-template-areas: "num title" "video video"; gap: 16px 20px; padding: 28px 0; }
  .metier-row .num { grid-area: num; }
  .metier-row .title { grid-area: title; }
  .metier-row .preview { grid-area: video; height: 200px; margin-top: 8px; }
  .metier-row .arr { display: none; }
  .products { grid-template-columns: repeat(2, 1fr); }
  .gal-grid { grid-auto-rows: 100px; }
  .contact-grid { grid-template-columns: 1fr; gap: 56px; }
  .footer-inner { grid-template-columns: 1fr 1fr; }
  .pub-inner { padding: 60px 28px; }
}
@media (max-width: 960px) {
  .nav a.nav-link { display: none; }
}
@media (max-width: 640px) {
  .nav { top: 10px; }
  .nav-inner { padding: 5px 5px 5px 12px; }

<script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useMemo, useCallback } = React;

// ---------------------------------------------------------------
// HOOKS
// ---------------------------------------------------------------
function useScrollY() {
  const [y, setY] = useState(0);
  useEffect(() => {
    let raf = 0;
    const on = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => { setY(window.scrollY); raf = 0; });
    };
    on();
    window.addEventListener('scroll', on, { passive: true });
    return () => window.removeEventListener('scroll', on);
  }, []);
  return y;
}

function useReveal() {
  useEffect(() => {
    const setup = () => {
      const els = document.querySelectorAll('.reveal');
      const io = new IntersectionObserver((entries) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            e.target.classList.add('in');
            io.unobserve(e.target);
          }
        });
      }, { threshold: 0.08, rootMargin: '0px 0px -40px 0px' });
      els.forEach(el => { if (!el.classList.contains('in')) io.observe(el); });
      return io;
    };
    let io = setup();
    const t = setTimeout(() => { io.disconnect(); io = setup(); }, 300);
    const fb = setTimeout(() => {
      document.querySelectorAll('.reveal:not(.in)').forEach(el => {
        const r = el.getBoundingClientRect();
        if (r.top < window.innerHeight && r.bottom > 0) el.classList.add('in');
      });
    }, 800);
    return () => { io && io.disconnect(); clearTimeout(t); clearTimeout(fb); };
  }, []);
}

function useClipReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.maison-imgwrap');
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
    }, { threshold: 0.2 });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
}

function useCountUp() {
  useEffect(() => {
    const els = document.querySelectorAll('[data-count]');
    const io = new IntersectionObserver((entries) => {
      entries.forEach(e => {
        if (!e.isIntersecting) return;
        const el = e.target;
        io.unobserve(el);
        const target = parseFloat(el.dataset.count);
        const dur = 1400;
        const start = performance.now();
        const suffix = el.dataset.suffix || '';
        const tick = (t) => {
          const p = Math.min(1, (t - start) / dur);
          const eased = 1 - Math.pow(1 - p, 3);
          el.textContent = (target * eased).toFixed(0) + suffix;
          if (p < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      });
    }, { threshold: 0.4 });
    els.forEach(el => io.observe(el));
    return () => io.disconnect();
  }, []);
}

// ---------------------------------------------------------------
// CUSTOM CURSOR
// ---------------------------------------------------------------
function Cursor() {
  const dot = useRef(null);
  const pos = useRef({ x: window.innerWidth/2, y: window.innerHeight/2 });
  const target = useRef({ x: window.innerWidth/2, y: window.innerHeight/2 });
  const [label, setLabel] = useState('');
  const [active, setActive] = useState(false);

  useEffect(() => {
    let raf;
    const tick = () => {
      pos.current.x += (target.current.x - pos.current.x) * 0.22;
      pos.current.y += (target.current.y - pos.current.y) * 0.22;
      if (dot.current) {
        dot.current.style.transform = `translate(${pos.current.x}px, ${pos.current.y}px) translate(-50%, -50%)`;
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);

    const move = (e) => {
      target.current.x = e.clientX;
      target.current.y = e.clientY;
    };
    const over = (e) => {
      const el = e.target.closest('[data-cursor]');
      if (el) {
        setActive(true);
        setLabel(el.dataset.cursor || '');
      } else {
        setActive(false);
        setLabel('');
      }
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseover', over);
    return () => {
      cancelAnimationFrame(raf);
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseover', over);
    };
  }, []);

  return (
    <div ref={dot} className={`cursor ${active ? 'active' : ''}`}>
      <span className="cursor-label">{label}</span>
    </div>
  );
}

function App() {
  const y = useScrollY();
  const [tops, setTops] = useState({});
  const [activeId, setActiveId] = useState('hero');

  useEffect(() => {
    const measure = () => {
      const next = {};
      ['hero','maison','histoire','vision','stats','metiers','pub','selection','galerie','contact','visite'].forEach(id => {
        const el = document.getElementById(id);
        if (el) next[id] = el.offsetTop;
      });
      setTops(next);
    };
    measure();
    window.addEventListener('resize', measure);
    const t1 = setTimeout(measure, 300);
    const t2 = setTimeout(measure, 1200);
    return () => { window.removeEventListener('resize', measure); clearTimeout(t1); clearTimeout(t2); };
  }, []);

  useEffect(() => {
    const ids = NAV.map(n => n.id);
    let current = 'hero';
    for (const id of ids) {
      const t = tops[id];
      if (t !== undefined && y + window.innerHeight * 0.35 >= t) current = id;
    }
    setActiveId(current);
  }, [y, tops]);

  useReveal();
  useClipReveal();
  useCountUp();

  const onJump = (id) => {
    const el = document.getElementById(id);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  return (
    <>
      <Loader />
      <Cursor />
      <ScrollProgress y={y} />
      <Nav scrolled={y > 80} activeId={activeId} onJump={onJump} />
      <Hero y={y} />
      <MaisonSection />
      <BigMarquee />
      <HistoireSection />
      <VisionSection />
      <StatsSection />
      <MetiersSection />
      <PubSection y={y} sectionTop={tops.pub||0} />
      <SelectionSection y={y} sectionTop={tops.selection||0} />
      <GalerieSection />
      <ContactSection />
      <VisiteSection />
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
